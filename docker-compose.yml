version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: kalshi_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: kalshi_mispricing
      MYSQL_USER: kalshi
      MYSQL_PASSWORD: kalshi_secret
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kalshi", "-pkalshi_secret"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - mysql_data:/var/lib/mysql

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalshi_ingestion
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LINEEDGE_DB_URL: mysql+pymysql://kalshi:kalshi_secret@mysql:3306/kalshi_mispricing
      PYTHONUNBUFFERED: "1"
    command: ["python", "scripts/run_ingestion.py", "--interval", "30"]

volumes:
  mysql_data:
