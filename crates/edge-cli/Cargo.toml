[package]
name = "edge-cli"
description = "Runnable pipeline: venue feed to assembler to strategy to risk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "edge_cli"
path = "src/lib.rs"

[[bin]]
name = "edge"
path = "src/main.rs"

[dependencies]
edge-core = { workspace = true }
edge-book = { workspace = true }
edge-risk = { workspace = true }
edge-alpha = { workspace = true }
edge-data = { workspace = true }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
